<title>Crossfade Prototype</title>
<meta name="description" content="Two clickable ideas for sending music across Apple Music and Spotify.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: full-width two-column stage on laptops (cover + summary left, list right); one column on phones with a fixed action bar. */
:root {
  --paper: #F7F7FB;
  --surface: #FFFFFF;
  --ink: #1C1A33;
  --on-ink: #FFFFFF;
  --ink-soft: #5A5775;
  --signal: #2B45D8;
  --amber: #A86400;
  --mist: #B9B6CC;
  --line: #E2E0EC;
  --note: #ECEBF6;
  --you: #2B45D8;
  --them: #C2365B;
  --font: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121120; --surface: #1B1A2C; --ink: #EDECF6; --on-ink: #121120;
    --ink-soft: #A7A4BF; --signal: #8C9BFF; --amber: #E3A23B; --mist: #4E4C66;
    --line: #2A2842; --note: #211F38; --you: #8C9BFF; --them: #FF7FA3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121120; --surface: #1B1A2C; --ink: #EDECF6; --on-ink: #121120;
  --ink-soft: #A7A4BF; --signal: #8C9BFF; --amber: #E3A23B; --mist: #4E4C66;
  --line: #2A2842; --note: #211F38; --you: #8C9BFF; --them: #FF7FA3; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 17px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
  padding-inline: clamp(18px, 4vw, 56px);
}
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

.proto { max-width: 1240px; margin: 0 auto; padding-block: 12px; font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; }
.proto button { background: none; border: 0; color: var(--signal); padding: 0; cursor: pointer; font-size: 13px; }
#app { max-width: 1240px; margin: 0 auto; padding-block: 8px 190px; }

/* the two-column stage */
.stage { display: grid; gap: 28px; }
.lead, .detail { min-width: 0; display: flex; flex-direction: column; }
@media (min-width: 900px) {
  #app { padding-block: 16px 64px; }
  .stage { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(40px, 6vw, 96px); align-items: start; }
  .lead { position: sticky; top: 24px; }
  .detail { padding-top: 64px; }
}

.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-stretch: 112%; margin-bottom: 28px; letter-spacing: -0.01em; }
.brand::before { content: ""; width: 24px; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--ink) 0 45%, var(--signal) 55% 100%); }

h1 { font-size: clamp(34px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.035em; font-weight: 850; font-stretch: 118%; margin: 0 0 14px; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 750; font-stretch: 110%; letter-spacing: -0.01em; margin: 0 0 12px; }
.lede { color: var(--ink-soft); margin: 0 0 24px; max-width: 40ch; font-size: 18px; }
.small { font-size: 14px; color: var(--ink-soft); margin: 0; }
p { margin: 0 0 12px; }
.gap-top { margin-top: 28px; }

/* buttons */
.btn { display: block; width: 100%; text-align: center; font-weight: 700; padding: 16px; border-radius: 14px; border: 0; cursor: pointer; }
.btn-primary { background: var(--ink); color: var(--on-ink); font-size: 18px; }
.btn-primary:disabled { background: var(--mist); color: var(--paper); cursor: default; }
.btn-quiet { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn-text { background: none; border: 0; color: var(--signal); padding: 10px 0; cursor: pointer; font-weight: 650; }
.back { background: none; border: 0; color: var(--ink-soft); padding: 0; margin: -4px 0 18px; cursor: pointer; font-size: 15px; align-self: flex-start; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); }
.bar-inner { max-width: 420px; margin: 0 auto; display: grid; gap: 8px; }
.bar .small { text-align: center; }
.bar.inline { position: static; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; padding: 0; margin-top: 28px; }
.bar.inline .bar-inner { max-width: 440px; margin: 0; }
.bar.inline .small { text-align: left; }

/* covers */
.cover { height: auto; border-radius: 10px; aspect-ratio: 1; object-fit: cover; background: var(--note); box-shadow: 0 1px 0 var(--line); }
.cover-hero { width: 148px; margin-bottom: 20px; border-radius: 12px; }
@media (min-width: 900px) { .cover-hero { width: min(100%, 360px); border-radius: 14px; margin-bottom: 26px; } }
.cover-sm { width: 44px; border-radius: 5px; }
.cover-md { width: 64px; border-radius: 7px; flex: none; }
.stack { display: flex; }
.stack img { width: 64px; border-radius: 8px; border: 3px solid var(--surface); margin-right: -26px; }
.stack img:last-child { margin-right: 0; }

/* start screen */
.ideas { display: grid; gap: 16px; }
.idea { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.idea:hover { border-color: var(--signal); }
.idea .art { grid-row: 1 / span 3; }
.idea .which { font-size: 13px; color: var(--signal); font-weight: 700; }
.idea b { font-size: 24px; font-weight: 850; font-stretch: 115%; letter-spacing: -0.02em; line-height: 1.05; }
.idea .desc { color: var(--ink-soft); font-size: 15px; }
@media (max-width: 520px) { .idea { grid-template-columns: 1fr; } .idea .art { grid-row: auto; margin-bottom: 8px; } }

/* fields */
label { display: block; font-weight: 650; font-size: 15px; margin: 0 0 6px; }
input[type=text] { width: 100%; font: inherit; padding: 15px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); min-width: 0; }

/* track strip */
.strip { display: flex; gap: 4px; height: 64px; margin: 0 0 14px; }
.strip i { flex: 1; border-radius: 4px; background: var(--ink); transform-origin: bottom; }
.strip i.close { background: var(--amber); }
.strip i.miss { background: transparent; box-shadow: inset 0 0 0 2px var(--mist); }
.strip i.pending { background: var(--line); }
.strip.rise i { animation: rise .5s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i) * 22ms); }
@keyframes rise { from { transform: scaleY(.08); opacity: .2; } }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; padding: 0; list-style: none; }
.legend li::before { content: ""; display: inline-block; width: 10px; height: 14px; border-radius: 2px; margin-right: 6px; vertical-align: -2px; background: var(--ink); }
.legend .close::before { background: var(--amber); }
.legend .miss::before { background: transparent; box-shadow: inset 0 0 0 2px var(--mist); }
.summary { font-size: 21px; line-height: 1.3; font-weight: 650; margin: 0 0 6px; }
.progress { font-size: 20px; font-weight: 650; margin: 0 0 14px; }

/* rows */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) auto; gap: 0 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.rows .n { color: var(--ink-soft); font-size: 14px; }
.rows .txt { min-width: 0; }
.rows .t { font-weight: 650; display: block; }
.rows .a { color: var(--ink-soft); font-size: 15px; display: block; }
.rows .m { font-size: 14px; margin-top: 2px; display: block; }
.rows .r { font-size: 15px; color: var(--ink-soft); text-align: right; }
.rows li.close .m { color: var(--amber); }
.rows li.miss .t, .rows li.miss .a, .rows li.miss .r { color: var(--mist); }
.rows li.miss img { opacity: .35; filter: grayscale(1); }
.rows li.miss .m { color: var(--ink-soft); }
.rows li.new { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--signal) 18%, transparent); } }

.linkbox { font-size: 19px; font-weight: 650; padding: 15px 16px; border: 1.5px dashed var(--signal); border-radius: 14px; word-break: break-all; user-select: all; margin: 0 0 6px; }
.from { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }

.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #fff; background: #3B3866; flex: none; }
.avatar.am { background: #C2365B; }
.avatar.sp { background: #1F7A4D; }
.people { display: grid; gap: 12px; list-style: none; padding: 0; margin: 4px 0 0; }
.people li { display: flex; align-items: center; gap: 12px; }
.people .svc { color: var(--ink-soft); font-size: 14px; display: block; }
.people .pct { margin-left: auto; font-weight: 750; font-stretch: 112%; }

/* choices */
.options { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.opt { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--signal); box-shadow: inset 0 0 0 1.5px var(--signal); }
.opt b { font-weight: 700; }
.opt .d { color: var(--ink-soft); font-size: 14px; display: block; }
.tabs { display: flex; gap: 6px; margin: 0 0 14px; padding: 4px; background: var(--note); border-radius: 12px; }
.tabs button { flex: 1; border: 0; padding: 10px; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 650; color: var(--ink-soft); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); }

.qrwrap { display: grid; justify-items: start; gap: 8px; margin: 0 0 18px; }
canvas.qr { width: 220px; height: 220px; background: #fff; border-radius: 12px; padding: 12px; border: 1.5px solid var(--line); }

.notice { background: var(--note); border-radius: 16px; padding: 16px 18px; font-size: 16px; color: var(--ink-soft); margin: 0 0 16px; max-width: 52ch; }
.notice b { color: var(--ink); }

.sheet { background: var(--surface); border-radius: 22px; border: 1.5px solid var(--line); padding: 16px 18px 6px; margin-top: 26px; }
.addrow { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.addrow button { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 16px; cursor: pointer; font-weight: 650; }
.addrow button:disabled { color: var(--ink-soft); cursor: default; }

.done-mark { font-size: clamp(56px, 7vw, 96px); line-height: 1; font-weight: 900; font-stretch: 125%; letter-spacing: -0.04em; color: var(--signal); margin-bottom: 14px; }

/* taste match: two circles that overlap as much as the tastes do */
.taste { display: grid; gap: 14px; }
.venn { position: relative; height: 150px; width: 100%; max-width: 340px; }
.venn span { position: absolute; top: 0; width: 150px; height: 150px; border-radius: 50%; mix-blend-mode: multiply; }
.venn .you { left: 0; background: color-mix(in srgb, var(--you) 55%, transparent); }
.venn .them { background: color-mix(in srgb, var(--them) 55%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .venn span { mix-blend-mode: screen; } }
:root[data-theme="dark"] .venn span { mix-blend-mode: screen; }
.venn .lbl { position: absolute; top: 58px; font-size: 13px; font-weight: 700; color: var(--ink); mix-blend-mode: normal; width: auto; height: auto; border-radius: 0; background: none; }
.pct-big { font-size: clamp(48px, 6vw, 76px); font-weight: 900; font-stretch: 122%; letter-spacing: -0.04em; line-height: 1; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; margin: 0; }
.chips li { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--note); font-size: 15px; font-weight: 600; }
.chips img { width: 28px; border-radius: 50%; }

.choice-row { display: grid; gap: 12px; }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

    }).join("") + "</ol>";
  }
  var missText = MISSES.map(function (t) { return esc(t[0]) + " by " + esc(t[1]); }).join(", ");

  function tasteBlock(name, cls) {
    var f = FRIENDS[name], d = 150, offset = Math.round(d * (1 - f.pct / 100) * 1.25);
    return '<div class="taste">' +
      '<div class="venn" role="img" aria-label="Taste overlap ' + f.pct + ' percent" style="height:' + d + 'px"><span class="you"></span><span class="them" style="left:' + offset + 'px"></span>' +
      '<span class="lbl" style="left:16px">You</span><span class="lbl" style="left:' + (offset + d - 70) + 'px">' + name + "</span></div>" +
      '<p class="pct-big">' + f.pct + "% alike</p>" +
      '<p class="small">Based on the artists in both your libraries. ' + esc(f.diff) + "</p>" +
      '<h2 class="gap-top" style="margin-bottom:10px">You both play</h2>' +
      '<ul class="chips">' + f.shared.map(function (a) { return "<li>" + img(a, "", 28, "") + esc(a) + "</li>"; }).join("") + "</ul></div>";
  }

  var screens = {
    start: function () {
      setBar("");
      return stage(
        brand + "<h1>Send music to a friend on another app</h1>" +
        '<p class="lede">Two ideas for the same problem: you’re on Apple Music, your friend is on Spotify. Try both, then say which you’d use.</p>' +
        (S.tried.a && S.tried.b ? '<button type="button" class="btn btn-primary" style="max-width:440px" data-go="vote">I’ve tried both</button>' : ""),
        '<div class="ideas">' +
        '<button type="button" class="idea" data-go="aCreate"><span class="art">' + img(PLAYLIST, "Aaliyah", 120, "cover-md", "") + '</span><span class="which">Idea 1' + (S.tried.a ? ", tried" : "") + '</span><b>Send a link</b><span class="desc">Paste a playlist link, text it to a friend, they press play in Spotify. Nobody signs in.</span></button>' +
        '<button type="button" class="idea" data-go="bConnect"><span class="art stack">' + img("SOS", "SZA", 120, "", "") + img("Blonde", "Frank Ocean", 120, "", "") + img("Friday pregame", "", 120, "", "") + '</span><span class="which">Idea 2' + (S.tried.b ? ", tried" : "") + '</span><b>Listen together</b><span class="desc">Connect your account, share a playlist or album by QR code, see how alike your taste is, build one list together.</span></button>' +
        "</div>");
    },

    // ----- Idea 1 -----
    aCreate: function () {
      setBar('<button type="button" class="btn btn-primary" data-go="aBuild">Create link</button>');
      return stage(
        backBtn() + brand + "<h1>Send a playlist to someone on Spotify</h1>" +
        '<p class="lede">In Apple Music, open a playlist, tap Share, then Copy Link. Paste it here.</p>',
        '<label for="amlink">Apple Music link</label>' +
        '<input id="amlink" type="text" value="https://music.apple.com/us/playlist/late-train-home/pl.u-8aAVZ" autocomplete="off">' +
        '<p class="small" style="margin-top:8px">Filled in with a sample playlist so you can try it.</p>');
    },
    aBuild: function () {
      setBar('<button type="button" class="btn btn-primary" disabled>Create link</button>');
      var k = 0; clearInterval(timer);
      timer = setInterval(function () {
        k++;
        var p = document.getElementById("prog"), st = document.getElementById("stripHold");
        if (!p) { clearInterval(timer); return; }
        p.textContent = k < 3 ? "Reading playlist…" : "Matching " + Math.min(k - 2, N) + " of " + N + "…";
        st.innerHTML = strip(Math.max(0, k - 2));
        if (k - 2 >= N) { clearInterval(timer); setTimeout(function () { go("aReady", true); }, 350); }
      }, 110);
      return stage(brand + img(PLAYLIST, "Aaliyah", 360, "cover-hero", PLAYLIST + " cover") + "<h1>" + PLAYLIST + "</h1>",
        '<p class="progress" id="prog">Reading playlist…</p><div id="stripHold">' + strip(0) + '</div><p class="small">Finding each song on Spotify.</p>');
    },
    aReady: function () {
      setBar('<button type="button" class="btn btn-primary" data-copy="https://crossfade.app/p/x7Kq2mVb9R">Copy link</button>' +
        '<button type="button" class="btn btn-text" data-go="aFriend">See what your friend sees</button>');
      return stage(
        brand + img(PLAYLIST, "Aaliyah", 360, "cover-hero", PLAYLIST + " cover") + "<h1>" + PLAYLIST + "</h1>" + strip() + LEGEND +
        '<p class="summary">' + MATCHED + " of " + N + " songs found on Spotify.</p>" +
        '<p class="small">Your friend won’t hear ' + missText + ".</p>",
        "<h2>Your link</h2>" + '<p class="linkbox">https://crossfade.app/p/x7Kq2mVb9R</p>' +
        '<p class="small">Text it to a friend. They don’t need to sign in.</p>');
    },
    aFriend: function () {
      setBar('<button type="button" class="btn btn-primary" data-go="aPlaying">Play in Spotify</button><p class="small">Opens Spotify. No sign-in, nothing added to your library.</p>');
      return stage(
        '<p class="small" style="margin-bottom:14px">Now you’re the friend who got the text.</p>' + brand +
        '<div class="from"><span class="avatar" style="background:var(--signal)">A</span><span>Aaliyah sent you this from Apple Music</span></div>' +
        img(PLAYLIST, "Aaliyah", 360, "cover-hero", PLAYLIST + " cover") +
        "<h1>" + PLAYLIST + "</h1>" + strip(undefined, true) + LEGEND +
        '<p class="summary">' + MATCHED + " of " + N + ' songs are on Spotify, <span style="white-space:nowrap">' + LENGTH + ".</span></p>" +
        '<p class="small">Missing: ' + missText + ".</p>",
        "<h2>What’s in it</h2>" + trackRows());
    },
    aPlaying: function () {
      S.tried.a = true;
      setBar('<button type="button" class="btn btn-primary" data-go="start">Back to both ideas</button>');
      return stage(brand + '<div class="done-mark">Playing</div><h1>Spotify would open here and start the playlist</h1>',
        '<div class="notice"><b>What just happened:</b> one link, one tap, music. ' + MATCHED + " of " + N + " songs play in order. Nothing was saved to the friend’s library and nobody signed in.</div>" +
        '<div class="notice"><b>Why there’s no taste match here:</b> your friend never signs in, so Crossfade can’t see what they listen to.</div>');
    },

    // ----- Idea 2 -----
    bConnect: function () {
      var on = function (s) { return S.service === s ? "true" : "false"; };
      setBar('<button type="button" class="btn btn-primary" data-go="bPick"' + (S.service ? "" : " disabled") + ">Connect " + (S.service || "your account") + "</button>");
      return stage(
        backBtn() + brand + "<h1>Which app do you listen on?</h1>" +
        '<p class="lede">Crossfade reads your playlists and albums so you can share them, and compares your taste with your friends’.</p>',
        '<ul class="options">' +
        '<li><button type="button" class="opt" data-service="Apple Music" aria-pressed="' + on("Apple Music") + '"><span class="avatar am">AM</span><span><b>Apple Music</b><span class="d">Share from your library</span></span></button></li>' +
        '<li><button type="button" class="opt" data-service="Spotify" aria-pressed="' + on("Spotify") + '"><span class="avatar sp">S</span><span><b>Spotify</b><span class="d">Share from your library</span></span></button></li>' +
        "</ul>" + '<p class="small" style="margin-top:16px">On a family plan? Connecting uses your own profile. The person who pays isn’t notified.</p>');
    },
    bPick: function () {
      var list = SHAREABLE[S.tab];
      setBar('<button type="button" class="btn btn-primary" data-go="bShare">Share “' + esc(S.pick.name) + "”</button>");
      return stage(
        backBtn() + brand + "<h1>Pick something to share</h1>" +
        '<p class="lede">Signed in to ' + esc(S.service) + " (sample library).</p>" +
        img(S.pick.name, S.tab === "albums" ? S.pick.by : "", 360, "cover-hero", S.pick.name + " cover"),
        '<div class="tabs" role="tablist">' +
        '<button type="button" role="tab" data-tab="playlists" aria-selected="' + (S.tab === "playlists") + '">Playlists</button>' +
        '<button type="button" role="tab" data-tab="albums" aria-selected="' + (S.tab === "albums") + '">Albums</button></div>' +
        '<ul class="options">' + list.map(function (x, i) {
          return '<li><button type="button" class="opt" data-pick="' + i + '" aria-pressed="' + (S.pick === x) + '">' + img(x.name, S.tab === "albums" ? x.by : "", 64, "cover-md") + "<span><b>" + esc(x.name) + '</b><span class="d">' + esc(x.by) + "</span></span></button></li>";
        }).join("") + "</ul>");
    },
    bShare: function () {
      setBar('<button type="button" class="btn btn-primary" data-go="bJoined">Pretend a friend scanned it</button>' +
        '<button type="button" class="btn btn-quiet" data-copy="https://crossfade.app/j/MV4R">Copy invite link</button>');
      setTimeout(drawQR, 0);
      return stage(
        backBtn() + brand + "<h1>Show this to your friends</h1>" +
        '<p class="lede">They scan it with their camera and join from whatever app they use.</p>' +
        '<div class="from">' + img(S.pick.name, S.tab === "albums" ? S.pick.by : "", 64, "cover-md") + "<span>Sharing <b>" + esc(S.pick.name) + "</b>" + (S.tab === "albums" ? " by " + esc(S.pick.by) : "") + "</span></div>",
        '<div class="qrwrap"><canvas class="qr" id="qr" width="220" height="220" role="img" aria-label="Sample QR code"></canvas>' +
        '<p class="small">Sample code. It doesn’t scan to anything.</p></div>' +
        '<p class="linkbox">crossfade.app/j/MV4R</p>');
    },
    bJoined: function () {
      var other = S.service === "Spotify" ? "Apple Music" : "Spotify";
      S.members = [
        { name: "You", svc: S.service, cls: S.service === "Spotify" ? "sp" : "am" },
        { name: "Jordan", svc: other, cls: other === "Spotify" ? "sp" : "am", pct: FRIENDS.Jordan.pct }
      ];
      if (!S.queue.length) S.queue = TRACKS.slice(0, 5).map(function (t) { return { t: t[0], a: t[1], by: "You" }; });
      setBar('<button type="button" class="btn btn-primary" data-go="bRoom">Open the group</button>');
      return stage(
        brand + '<div class="done-mark">+1</div><h1>Jordan joined from ' + other + "</h1>" +
        '<p class="summary">' + (S.pick.n - 1) + " of " + S.pick.n + " songs found on " + other + ".</p>" +
        '<p class="small">One song wasn’t on ' + other + ". Jordan can see which one.</p>",
        tasteBlock("Jordan"));
    },
    bRoom: function () {
      S.tried.b = true;
      setBar('<button type="button" class="btn btn-primary" data-go="bPlaying">Play in ' + esc(S.service) + "</button>" +
        '<p class="small">Everyone plays in their own app. Crossfade keeps the list the same for all of you.</p>');
      return stage(
        brand + img(S.pick.name, S.tab === "albums" ? S.pick.by : "", 360, "cover-hero", S.pick.name + " cover") +
        "<h1>" + esc(S.pick.name) + "</h1>" +
        '<ul class="people">' + S.members.map(function (m) {
          return '<li><span class="avatar ' + m.cls + '">' + m.name[0] + '</span><span><b>' + m.name + '</b><span class="svc">' + m.svc + "</span></span>" +
            (m.pct ? '<span class="pct">' + m.pct + "% alike</span>" : "") + "</li>";
        }).join("") + "</ul>",
        "<h2>Up next</h2>" +
        '<ol class="rows">' + S.queue.map(function (q, i) {
          return '<li class="' + (q.isNew ? "new" : "") + '"><span class="n">' + (i + 1) + "</span>" + img(q.a, "", 44, "cover-sm") +
            '<span class="txt"><span class="t">' + esc(q.t) + '</span><span class="a">' + esc(q.a) + '</span></span><span class="r">' + esc(q.by) + "</span></li>";
        }).join("") + "</ol>" +
        '<div class="sheet"><h2>Add a song</h2>' +
        SUGGEST.map(function (s, i) {
          var done = S.added[i];
          return '<div class="addrow">' + img(s[1], "", 44, "cover-sm") + '<span><b>' + esc(s[0]) + '</b><br><span class="small">' + esc(s[1]) + '</span></span><button type="button" data-add="' + i + '"' + (done ? " disabled" : "") + ">" + (done ? "Added" : "Add") + "</button></div>";
        }).join("") + "</div>");
    },
    bPlaying: function () {
      setBar('<button type="button" class="btn btn-primary" data-go="start">Back to both ideas</button>');
      return stage(brand + '<div class="done-mark">Playing</div><h1>' + esc(S.service) + " would open here with the group list</h1>",
        '<div class="notice"><b>What this idea can and can’t do:</b> everyone gets the same list in their own app, and new songs show up for everyone. It can’t make you hear the same second of the same song at the same time. No music app lets another app control playback that way.</div>');
    },

    vote: function () {
      setBar('<button type="button" class="btn btn-quiet" data-go="start">Back to start</button>');
      return stage(brand + "<h1>Which one would you actually use?</h1>" +
        '<p class="lede">Pick one, then tell Aaliyah why. The reason matters more than the pick.</p><p class="summary" id="voted" hidden></p>',
        '<div class="choice-row">' +
        '<button type="button" class="idea" data-vote="Send a link"><span class="art">' + img(PLAYLIST, "Aaliyah", 120, "cover-md") + '</span><b>Send a link</b><span class="desc">Quick, no sign-in, one playlist at a time.</span></button>' +
        '<button type="button" class="idea" data-vote="Listen together"><span class="art">' + img("SOS", "SZA", 120, "cover-md") + '</span><b>Listen together</b><span class="desc">Sign in once, share by QR code, see your taste match, one shared list.</span></button>' +
        '<button type="button" class="idea" data-vote="Neither"><b>Neither</b><span class="desc">I’d still send a screenshot, or just not bother.</span></button></div>');
    }
  };

  function drawQR() {
    var c = document.getElementById("qr"); if (!c) return;
    var x = c.getContext("2d"), n = 25, W = c.width, cell = W / n, seed = 7;
    var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, W); x.fillStyle = "#1C1A33";
    var finder = function (r, q) { return (r < 7 && q < 7) || (r < 7 && q >= n - 7) || (r >= n - 7 && q < 7); };
    for (var r = 0; r < n; r++) for (var q = 0; q < n; q++) { if (!finder(r, q) && rnd() > 0.52) x.fillRect(q * cell, r * cell, Math.ceil(cell), Math.ceil(cell)); }
    [[0, 0], [0, n - 7], [n - 7, 0]].forEach(function (p) {
      var y0 = p[0] * cell, x0 = p[1] * cell;
      x.fillRect(x0, y0, 7 * cell, 7 * cell); x.fillStyle = "#fff"; x.fillRect(x0 + cell, y0 + cell, 5 * cell, 5 * cell);
      x.fillStyle = "#1C1A33"; x.fillRect(x0 + 2 * cell, y0 + 2 * cell, 3 * cell, 3 * cell);
    });
  }

  function paint(keepScroll) {
    var y = window.scrollY;
    app.innerHTML = '<section class="screen">' + screens[current]() + "</section>";
    var lead = app.querySelector(".lead");
    if (barHTML && wide.matches && lead) {
      bar.hidden = true; barInner.innerHTML = "";
      var b = document.createElement("div"); b.className = "bar inline"; b.innerHTML = '<div class="bar-inner">' + barHTML + "</div>";
      lead.appendChild(b);
    } else if (barHTML) { barInner.innerHTML = barHTML; bar.hidden = false; }
    else { bar.hidden = true; barInner.innerHTML = ""; }
    window.scrollTo(0, keepScroll ? y : 0);
  }
  function go(name, replace) {
    if (!replace && current !== name) history.push(current);
    if (name === "start") history = [];
    current = name; clearInterval(timer); paint(false);
  }
  function rerender() { paint(true); }
  if (wide.addEventListener) wide.addEventListener("change", function () { if (current !== "aBuild") rerender(); });
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('900 40px "Archivo"'), document.fonts.load('600 20px "Archivo"')]).then(function () {
      artCache = {}; if (current !== "aBuild") rerender();
    }, function () {});
  }

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest("button"); if (!el) return;
    if (el.id === "restart") { reset(false); history = []; go("start", true); return; }
    if (el.hasAttribute("data-back")) { current = history.pop() || "start"; clearInterval(timer); paint(false); return; }
    if (el.dataset.go) {
      if (el.dataset.go === "bConnect" || el.dataset.go === "aCreate") reset(true);
      go(el.dataset.go); return;
    }
    if (el.dataset.service) { S.service = el.dataset.service; rerender(); return; }
    if (el.dataset.tab) { S.tab = el.dataset.tab; S.pick = SHAREABLE[S.tab][0]; rerender(); return; }
    if (el.dataset.pick) { S.pick = SHAREABLE[S.tab][+el.dataset.pick]; rerender(); return; }
    if (el.dataset.add) {
      var i = +el.dataset.add; S.added[i] = true;
      S.queue.forEach(function (q) { q.isNew = false; });
      S.queue.push({ t: SUGGEST[i][0], a: SUGGEST[i][1], by: "You", isNew: true });
      if (S.members.length < 3 && Object.keys(S.added).length === 2) {
        S.members.push({ name: "Maya", svc: "Spotify", cls: "sp", pct: FRIENDS.Maya.pct });
        S.queue.push({ t: "Redbone", a: "Childish Gambino", by: "Maya", isNew: true });
      }
      rerender(); return;
    }
    if (el.dataset.copy) {
      var text = el.dataset.copy, label = el.textContent;
      var done = function () { el.textContent = label === "Copy link" ? "Copied" : "Invite link copied"; setTimeout(function () { el.textContent = label; }, 2000); };
      try { navigator.clipboard.writeText(text).then(done, function () { selectLink(); done(); }); } catch (e) { selectLink(); done(); }
      return;
    }
    if (el.dataset.vote) {
      var v = document.getElementById("voted");
      document.querySelectorAll("[data-vote]").forEach(function (b) { b.style.borderColor = b === el ? "var(--signal)" : ""; });
      v.hidden = false;
      v.textContent = "You picked “" + el.dataset.vote + ".” Tell Aaliyah what made you choose it.";
    }
  });
  function selectLink() {
    var box = document.querySelector(".linkbox"); if (!box) return;
    var r = document.createRange(); r.selectNodeContents(box);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  go("start", true);
})();
</script>
