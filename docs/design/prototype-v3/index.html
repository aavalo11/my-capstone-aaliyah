<style>
/* Layout: one phone in the middle of the screen, a notes column beside it on laptops. On a real phone the frame drops away and the app fills the screen. */
:root {
  --paper: #F7F7FB;
  --surface: #FFFFFF;
  --ink: #1C1A33;
  --on-ink: #FFFFFF;
  --ink-soft: #5A5775;
  --signal: #2B45D8;
  --amber: #A86400;
  --danger: #B3261E;
  --mist: #B9B6CC;
  --line: #E2E0EC;
  --note: #ECEBF6;
  --you: #2B45D8;
  --them: #C2365B;
  --desk: #E4E3EE;
  --bezel: #16151F;
  --bubble: #E9E9EF;
  --scrim: rgba(20, 18, 40, .38);
  --font: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121120; --surface: #1B1A2C; --ink: #EDECF6; --on-ink: #121120;
    --ink-soft: #A7A4BF; --signal: #8C9BFF; --amber: #E3A23B; --danger: #FF8A80; --mist: #4E4C66;
    --line: #2A2842; --note: #211F38; --you: #8C9BFF; --them: #FF7FA3;
    --desk: #0B0A14; --bezel: #2C2B3A; --bubble: #2A2842; --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121120; --surface: #1B1A2C; --ink: #EDECF6; --on-ink: #121120;
  --ink-soft: #A7A4BF; --signal: #8C9BFF; --amber: #E3A23B; --danger: #FF8A80; --mist: #4E4C66;
  --line: #2A2842; --note: #211F38; --you: #8C9BFF; --them: #FF7FA3;
  --desk: #0B0A14; --bezel: #2C2B3A; --bubble: #2A2842; --scrim: rgba(0, 0, 0, .55); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--desk); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.42;
  font-variant-numeric: tabular-nums;
  padding-inline: 16px; padding-block: 20px;
  display: grid; place-items: center;
}
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; border-radius: 6px; }

.wrap { display: flex; gap: 56px; align-items: center; justify-content: center; max-width: 1100px; width: 100%; }

/* ---------- the phone ---------- */
.device {
  position: relative; flex: none;
  width: 390px; height: min(844px, calc(100vh - 40px)); min-height: 560px;
  background: var(--paper); border: 11px solid var(--bezel); border-radius: 56px;
  box-shadow: 0 30px 60px -20px rgba(20, 18, 50, .35), 0 0 0 1.5px color-mix(in srgb, var(--bezel) 60%, #888);
  overflow: hidden; display: flex; flex-direction: column;
}
.island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 118px; height: 34px; border-radius: 20px; background: #000; z-index: 30; }
.status { flex: none; height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0 34px; font-size: 15px; font-weight: 650; }
.status .icons { display: flex; gap: 6px; align-items: center; }
.status svg { display: block; }
.status .off { font-size: 12px; font-weight: 700; color: var(--danger); }
.home { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 132px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .85; z-index: 25; }

.view { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 2px 20px 24px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.actions { flex: none; padding: 10px 20px 10px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 94%, transparent); display: grid; gap: 6px; }
.actions .small { text-align: center; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px 24px; border-top: 1px solid var(--line); background: var(--surface); }
.tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 650; color: var(--ink-soft); padding: 4px 0; cursor: pointer; }
.tabbar button[aria-selected="true"] { color: var(--signal); }
.tabbar svg { width: 24px; height: 24px; }

/* top bar inside a screen */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; margin: 0 0 6px; gap: 8px; }
.back { background: none; border: 0; color: var(--signal); padding: 6px 0; cursor: pointer; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-stretch: 112%; letter-spacing: -0.01em; }
.brand::before { content: ""; width: 22px; height: 11px; border-radius: 6px; background: linear-gradient(90deg, var(--ink) 0 45%, var(--signal) 55% 100%); }
.pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--note); color: var(--ink-soft); white-space: nowrap; }

h1 { font-size: 30px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 850; font-stretch: 116%; margin: 4px 0 10px; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 750; font-stretch: 110%; letter-spacing: -0.01em; margin: 0 0 10px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 700; margin: 22px 0 8px; }
.lede { color: var(--ink-soft); margin: 0 0 18px; font-size: 16px; }
.small { font-size: 13.5px; color: var(--ink-soft); margin: 0; }
p { margin: 0 0 10px; }
.gap-top { margin-top: 22px; }

/* buttons */
.btn { display: block; width: 100%; text-align: center; font-weight: 700; padding: 15px; border-radius: 14px; border: 0; cursor: pointer; font-size: 16px; }
.btn-primary { background: var(--ink); color: var(--on-ink); font-size: 17px; }
.btn-primary:disabled { background: var(--mist); color: var(--paper); cursor: default; }
.btn-quiet { background: transparent; border: 1.5px solid var(--line); color: var(--ink); padding: 13px; }
.btn-text { background: none; border: 0; color: var(--signal); padding: 8px 0; cursor: pointer; font-weight: 650; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.icon-btn { background: var(--note); border: 0; border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }

/* fields */
label { display: block; font-weight: 650; font-size: 14px; margin: 0 0 6px; }
.field { display: flex; gap: 6px; align-items: stretch; margin: 0 0 14px; }
.field input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); }
.field input[aria-invalid="true"] { border-color: var(--danger); }
.field button { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 13px; padding: 0 13px; font-weight: 650; font-size: 14px; cursor: pointer; color: var(--signal); }
.err { display: flex; gap: 8px; align-items: flex-start; color: var(--danger); font-size: 14.5px; font-weight: 600; background: color-mix(in srgb, var(--danger) 9%, transparent); border-radius: 12px; padding: 10px 12px; margin: -4px 0 14px; }
.err::before { content: "!"; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--danger); color: var(--paper); font-size: 12px; font-weight: 900; display: grid; place-items: center; margin-top: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--signal); color: var(--signal); }

/* covers */
.cover { height: auto; border-radius: 10px; aspect-ratio: 1; object-fit: cover; background: var(--note); }
.cover-hero { width: 170px; margin: 4px 0 16px; border-radius: 12px; box-shadow: 0 12px 30px -14px rgba(20, 18, 50, .45); }
.cover-sm { width: 42px; border-radius: 5px; flex: none; }
.cover-md { width: 56px; border-radius: 7px; flex: none; }
.stack { display: flex; }
.stack img { width: 52px; border-radius: 8px; border: 3px solid var(--surface); margin-right: -20px; }
.stack img:last-child { margin-right: 0; }

/* track strip */
.strip { display: flex; gap: 3px; height: 52px; margin: 0 0 10px; }
.strip i { flex: 1; border-radius: 3px; background: var(--ink); transform-origin: bottom; }
.strip i.close { background: var(--amber); }
.strip i.fixed { background: var(--signal); }
.strip i.miss { background: transparent; box-shadow: inset 0 0 0 2px var(--mist); }
.strip i.pending { background: var(--line); }
.strip.rise i { animation: rise .5s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i) * 22ms); }
@keyframes rise { from { transform: scaleY(.08); opacity: .2; } }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; padding: 0; list-style: none; }
.legend li::before { content: ""; display: inline-block; width: 9px; height: 13px; border-radius: 2px; margin-right: 5px; vertical-align: -2px; background: var(--ink); }
.legend .close::before { background: var(--amber); }
.legend .fixed::before { background: var(--signal); }
.legend .miss::before { background: transparent; box-shadow: inset 0 0 0 2px var(--mist); }
.summary { font-size: 19px; line-height: 1.28; font-weight: 650; margin: 0 0 4px; }
.progress { font-size: 18px; font-weight: 650; margin: 0 0 12px; }

/* rows */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { border-top: 1px solid var(--line); }
.row { width: 100%; background: none; border: 0; text-align: left; display: grid; grid-template-columns: 22px 42px minmax(0, 1fr) auto; gap: 0 11px; padding: 9px 0; align-items: center; cursor: pointer; }
.row:active { background: var(--note); }
.row.static { cursor: default; }
.rows .n { color: var(--ink-soft); font-size: 13px; }
.rows .txt { min-width: 0; }
.rows .t { font-weight: 650; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .a { color: var(--ink-soft); font-size: 14px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rows .m { font-size: 13px; margin-top: 1px; display: block; }
.rows .r { font-size: 14px; color: var(--ink-soft); text-align: right; }
.rows li.close .m { color: var(--amber); }
.rows li.fixed .m { color: var(--signal); }
.rows li.miss .t, .rows li.miss .a, .rows li.miss .r { color: var(--mist); }
.rows li.miss img { opacity: .35; filter: grayscale(1); }
.rows li.miss .m { color: var(--ink-soft); }
.rows li.new { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--signal) 18%, transparent); } }
.empty { text-align: center; padding: 28px 12px; color: var(--ink-soft); border-top: 1px solid var(--line); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

.seg { display: flex; gap: 4px; margin: 0 0 12px; padding: 3px; background: var(--note); border-radius: 11px; }
.seg button { flex: 1; border: 0; padding: 8px 4px; border-radius: 8px; background: transparent; cursor: pointer; font-weight: 650; font-size: 13.5px; color: var(--ink-soft); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.linkbox { font-size: 16px; font-weight: 650; padding: 13px 14px; border: 1.5px dashed var(--signal); border-radius: 13px; word-break: break-all; user-select: all; margin: 0 0 6px; }
.from { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 15px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: #3B3866; flex: none; }
.avatar.am { background: #C2365B; }
.avatar.sp { background: #1F7A4D; }
.avatar.me { background: var(--signal); color: var(--on-ink); }

.notice { background: var(--note); border-radius: 14px; padding: 13px 15px; font-size: 14.5px; color: var(--ink-soft); margin: 0 0 12px; }
.notice b { color: var(--ink); }
.done-mark { font-size: 64px; line-height: 1; font-weight: 900; font-stretch: 125%; letter-spacing: -0.04em; color: var(--signal); margin: 18px 0 10px; }

/* option lists */
.options { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.opt { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 15px; cursor: pointer; }
.opt[aria-pressed="true"] { border-color: var(--signal); box-shadow: inset 0 0 0 1.5px var(--signal); }
.opt b { font-weight: 700; display: block; }
.opt .d { color: var(--ink-soft); font-size: 13.5px; display: block; }
.opt .tag { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--amber); white-space: nowrap; }
.opt > span:not(.tag):not(.avatar) { min-width: 0; }

/* grouped list (settings) */
.group { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.group > * + * { border-top: 1px solid var(--line); }
.item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; background: none; border: 0; text-align: left; cursor: pointer; font-size: 15.5px; }
.item .d { color: var(--ink-soft); font-size: 13px; display: block; font-weight: 400; }
.item .chev { color: var(--mist); font-size: 20px; line-height: 1; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--mist); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.item[aria-checked="true"] .switch { background: #2FA35A; }
.item[aria-checked="true"] .switch::after { transform: translateX(20px); }
.cant { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; font-size: 14.5px; }
.cant li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; color: var(--ink-soft); }
.cant li::before { content: "×"; color: var(--danger); font-weight: 900; }
.cant b { color: var(--ink); }

/* qr + taste */
canvas.qr { width: 200px; height: 200px; background: #fff; border-radius: 12px; padding: 10px; border: 1.5px solid var(--line); display: block; margin: 0 auto 8px; }
.venn { position: relative; height: 130px; width: 100%; max-width: 300px; margin-bottom: 10px; }
.venn span { position: absolute; top: 0; width: 130px; height: 130px; border-radius: 50%; mix-blend-mode: multiply; }
.venn .you { left: 0; background: color-mix(in srgb, var(--you) 55%, transparent); }
.venn .them { background: color-mix(in srgb, var(--them) 55%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .venn span { mix-blend-mode: screen; } }
:root[data-theme="dark"] .venn span { mix-blend-mode: screen; }
.venn .lbl { position: absolute; top: 52px; font-size: 12px; font-weight: 700; color: var(--ink); mix-blend-mode: normal; width: auto; height: auto; border-radius: 0; background: none; }
.pct-big { font-size: 48px; font-weight: 900; font-stretch: 122%; letter-spacing: -0.04em; line-height: 1; margin: 0 0 6px; }
.artist-chips li { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--note); font-size: 13.5px; font-weight: 600; }
.artist-chips img { width: 24px; border-radius: 50%; }
.people { display: grid; gap: 10px; list-style: none; padding: 0; margin: 0 0 6px; }
.people li { display: flex; align-items: center; gap: 10px; }
.people .svc { color: var(--ink-soft); font-size: 13px; display: block; }
.people .pct { margin-left: auto; font-weight: 750; font-stretch: 112%; font-size: 14px; }
.addrow { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; align-items: center; gap: 11px; padding: 9px 0; border-top: 1px solid var(--line); }
.addrow button { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 14px; cursor: pointer; font-weight: 650; font-size: 14px; }
.addrow button:disabled { color: var(--ink-soft); cursor: default; }

/* messages mock */
.thread { display: grid; gap: 6px; padding-top: 8px; }
.thread .stamp { text-align: center; font-size: 12px; color: var(--ink-soft); margin: 4px 0 8px; }
.bub { max-width: 78%; padding: 8px 13px; border-radius: 18px; font-size: 15.5px; line-height: 1.3; }
.bub.in { background: var(--bubble); justify-self: start; border-bottom-left-radius: 5px; }
.bub.out { background: #2E7CF6; color: #fff; justify-self: end; border-bottom-right-radius: 5px; }
.card-bub { justify-self: end; width: 74%; border-radius: 18px; overflow: hidden; background: var(--bubble); border: 0; padding: 0; text-align: left; cursor: pointer; border-bottom-right-radius: 5px; }
.card-bub img { width: 100%; aspect-ratio: 1.6; object-fit: cover; }
.card-bub span { display: block; padding: 8px 12px 10px; font-size: 13px; color: var(--ink-soft); }
.card-bub b { display: block; color: var(--ink); font-size: 14.5px; }
.read { justify-self: end; font-size: 11.5px; color: var(--ink-soft); }
.msgbar { display: flex; gap: 8px; align-items: center; }
.msgbar span { flex: 1; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; color: var(--mist); font-size: 15px; }

/* bottom sheet + toast */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 20px 30px; max-height: 82%; overflow-y: auto; transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.sheet.on { transform: none; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.sheet-head b { display: block; font-size: 17px; }
.sheet-list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 10px; }
.sheet-list button { background: none; border: 0; text-align: left; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.sheet-list button + button { border-top: 1px solid var(--line); }
.sheet-list .d { color: var(--ink-soft); font-weight: 400; font-size: 13.5px; }
.share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 14px; }
.share-grid button { background: none; border: 0; display: grid; justify-items: center; gap: 6px; font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 0; }
.share-grid i { width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 13px; color: #fff; }
.toast { position: absolute; left: 50%; bottom: 104px; transform: translate(-50%, 16px); z-index: 50; background: var(--ink); color: var(--on-ink); font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* notes column */
.notes { width: 300px; flex: none; font-size: 14.5px; color: var(--ink-soft); }
.notes .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin: 0 0 8px; }
.notes h2 { color: var(--ink); font-size: 26px; font-stretch: 116%; font-weight: 850; letter-spacing: -0.02em; margin: 0 0 6px; line-height: 1.05; }
.notes .stories { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; padding: 0; list-style: none; }
.notes .stories li { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.notes p { max-width: 36ch; }
.notes .open { margin-top: 16px; padding: 12px 14px; border-radius: 12px; border: 1.5px dashed var(--amber); color: var(--ink); font-size: 13.5px; }
.notes .open b { color: var(--amber); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.notes .foot { margin-top: 22px; font-size: 12.5px; }
.notes .foot button { background: none; border: 0; color: var(--signal); padding: 0; cursor: pointer; font-size: 12.5px; font-weight: 650; }

@media (max-width: 900px) { .notes { display: none; } }
@media (max-width: 520px) {
  body { padding: 0; display: block; background: var(--paper); }
  .wrap { display: block; height: 100%; }
  .device { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
  .island, .status, .home { display: none; }
  .view { padding-top: 10px; }
  .tabbar { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

    var c = document.getElementById(id); if (!c) return;
    var x = c.getContext("2d"), n = 25, W = c.width, cell = W / n, seed = 7;
    var rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, W); x.fillStyle = "#1C1A33";
    var finder = function (r, q) { return (r < 7 && q < 7) || (r < 7 && q >= n - 7) || (r >= n - 7 && q < 7); };
    for (var r = 0; r < n; r++) for (var q = 0; q < n; q++) { if (!finder(r, q) && rnd() > 0.52) x.fillRect(q * cell, r * cell, Math.ceil(cell), Math.ceil(cell)); }
    [[0, 0], [0, n - 7], [n - 7, 0]].forEach(function (p) {
      var y0 = p[0] * cell, x0 = p[1] * cell;
      x.fillRect(x0, y0, 7 * cell, 7 * cell); x.fillStyle = "#fff"; x.fillRect(x0 + cell, y0 + cell, 5 * cell, 5 * cell);
      x.fillStyle = "#1C1A33"; x.fillRect(x0 + 2 * cell, y0 + 2 * cell, 3 * cell, 3 * cell);
    });
  }

  // ---------- create-link validation (PRD order: passcode, format, rate limit) ----------
  function validate() {
    var url = S.url.trim(), code = S.code;
    if (S.offline) return { field: "net", msg: "No connection. Crossfade needs the internet to read your playlist." };
    if (!url) return { field: "url", msg: "Paste an Apple Music playlist link first." };
    if (code !== PASSCODE) return { field: "code", msg: "Wrong passcode." };
    var m = url.match(/^https?:\/\/music\.apple\.com\/([a-z]{2})\/playlist\//i);
    if (!m) return { field: "url", msg: "That isn’t an Apple Music playlist link. It should start with music.apple.com/us/playlist/." };
    if (m[1].toLowerCase() !== "us") return { field: "url", msg: "Crossfade only reads US Apple Music links for now. This one is from the " + m[1].toUpperCase() + " store." };
    if (S.problem === "toolong") return { field: "url", msg: "This playlist has 140 songs. Crossfade handles up to 100. Split it into two playlists and send both." };
    return null;
  }
  var PROBLEMS = {
    wrongcode: { url: SAMPLE_URL, code: "1234" },
    badlink: { url: "https://music.apple.com/us/album/sos/1657869377", code: PASSCODE },
    nonus: { url: "https://music.apple.com/gb/playlist/late-train-home/pl.u-8aAVZ", code: PASSCODE },
    toolong: { url: "https://music.apple.com/us/playlist/every-song-ive-liked/pl.u-2kQ9", code: PASSCODE },
    zero: { url: "https://music.apple.com/us/playlist/study-no-words/pl.u-0zZ1", code: PASSCODE }
  };

  function readFields() {
    var u = document.getElementById("url"), c = document.getElementById("code");
    if (u) S.url = u.value; if (c) S.code = c.value;
  }

  // ---------- events ----------
  document.addEventListener("click", function (ev) {
    if (ev.target === scrim) { closeSheet(); return; }
    var el = ev.target.closest("button"); if (!el) return;
    var d = el.dataset;
    if (current() === "send") readFields();

    if (d.tab) { switchTab(d.tab); return; }
    if (el.hasAttribute("data-back")) { closeSheet(); back(); return; }
    if (d.go) { closeSheet(); go(d.go); return; }
    if (el.hasAttribute("data-close")) { closeSheet(); return; }
    if (el.hasAttribute("data-restart")) { var tm = S.themeMode; S = fresh(); S.themeMode = tm; closeSheet(); paint(false); toast("Started over"); return; }

    // send
    if (el.hasAttribute("data-paste")) { S.url = SAMPLE_URL; S.err = null; paint(true); return; }
    if (el.hasAttribute("data-clear")) { S.url = ""; S.err = null; S.problem = null; paint(true); var u = document.getElementById("url"); if (u) u.focus(); return; }
    if (el.hasAttribute("data-showcode")) { S.showCode = !S.showCode; paint(true); return; }
    if (d.problem) {
      if (S.problem === d.problem) { S.problem = null; S.url = SAMPLE_URL; S.code = PASSCODE; }
      else { S.problem = d.problem; S.url = PROBLEMS[d.problem].url; S.code = PROBLEMS[d.problem].code; }
      S.err = null; paint(true); return;
    }
    if (el.hasAttribute("data-create")) {
      S.err = validate();
      if (S.err) { paint(true); return; }
      S.zero = S.problem === "zero"; go("building"); return;
    }
    if (el.hasAttribute("data-newlink")) { S.url = ""; S.err = null; S.problem = null; S.zero = false; S.stacks.send = ["send"]; paint(false); return; }
    if (d.sheet) { openSheet(SHEETS[d.sheet]()); return; }
    if (d.sheetgo) { closeSheet(); if (S.tab !== "send") switchTab("send"); go(d.sheetgo); return; }
    if (el.hasAttribute("data-airdrop")) { closeSheet(); toast("AirDrop would open here"); return; }
    if (el.hasAttribute("data-friendview")) { S.filter = "all"; S.query = ""; switchTab("friend", ["friend"]); return; }
    if (d.copy) {
      var text = d.copy, done = function () { toast(text.indexOf("http") === 0 ? "Link copied" : "Copied “" + text + "”"); };
      try { navigator.clipboard.writeText(text).then(done, function () { selectLink(); done(); }); } catch (e) { selectLink(); done(); }
      closeSheet(); return;
    }

    // friend
    if (d.filter) { S.filter = d.filter; paint(true); return; }
    if (d.track) { openSheet(SHEETS.track(+d.track)); return; }
    if (d.play !== undefined) { S.playFrom = +d.play; closeSheet(); go("playing"); return; }
    if (d.fix !== undefined) {
      S.fixFor = +d.fix; S.fixPick = null; S.fixQuery = ""; S.fixSearched = false;
      if (TRACKS[S.fixFor][2] === "miss" && !S.fixed[S.fixFor]) { S.fixQuery = TRACKS[S.fixFor][1]; S.fixSearched = true; }
      closeSheet(); go("fix"); return;
    }
    if (d.fixpick) { S.fixPick = d.fixpick; paint(true); return; }
    if (el.hasAttribute("data-usefix")) {
      var i = S.fixFor, src = S.fixPick[0] === "a" ? altsFor(i) : SEARCH.filter(function (r) { return (r.t + " " + r.a).toLowerCase().indexOf(S.fixQuery.trim().toLowerCase()) >= 0; });
      var pick = src[+S.fixPick.slice(1)];
      if (pick) S.fixed[i] = pick;
      back(); toast("Fixed. " + matched() + " of " + N + " now on Spotify"); return;
    }
    if (d.buy) { closeSheet(); toast("Would open this release on " + d.buy); return; }
    if (el.hasAttribute("data-retry")) { if (S.offline) toast("Still offline"); else paint(false); return; }

    // together
    if (d.service) { S.service = d.service; paint(true); return; }
    if (d.ttab) { S.ttab = d.ttab; S.pick = SHAREABLE[S.ttab][0]; paint(true); return; }
    if (d.tpick) { S.pick = SHAREABLE[S.ttab][+d.tpick]; paint(true); return; }
    if (d.add) {
      var a = +d.add; S.added[a] = true;
      S.queue.forEach(function (q) { q.isNew = false; });
      S.queue.push({ t: SUGGEST[a][0], a: SUGGEST[a][1], by: "You", isNew: true });
      if (!S.maya && Object.keys(S.added).length === 2) { S.maya = true; S.queue.push({ t: "Redbone", a: "Childish Gambino", by: "Maya", isNew: true }); toast("Maya joined from Spotify"); }
      paint(true); return;
    }

    // more
    if (d.themeMode) {
      S.themeMode = d.themeMode;
      if (d.themeMode === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", d.themeMode);
      paint(true); return;
    }
    if (el.hasAttribute("data-offline")) { S.offline = !S.offline; S.err = null; paint(true); toast(S.offline ? "Phone is offline" : "Back online"); return; }
    if (d.state === "missing") { switchTab("friend", ["friend", "missing"]); return; }
    if (d.state === "zero") { S.problem = "zero"; S.url = PROBLEMS.zero.url; S.code = PASSCODE; S.zero = true; S.err = null; switchTab("send", ["send"]); go("building"); return; }
    if (d.state === "allfixed") {
      S.fixed[11] = ALTS[11][0]; S.fixed[12] = SEARCH[0]; S.fixed[20] = SEARCH[2];
      S.filter = "missing"; S.query = ""; switchTab("friend", ["friend"]); toast("Every song is on Spotify now"); return;
    }
    if (d.vote) { S.vote = d.vote; paint(true); return; }
  });

  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.id === "url") {
      S.url = t.value; S.problem = null;
      var b = document.querySelector("[data-create]"); if (b) b.disabled = !t.value.trim();
    }
    if (t.id === "code") { S.code = t.value; }
    if (t.id === "q") {
      S.query = t.value;
      var tmp = document.createElement("div"); tmp.innerHTML = screens.friend().body;
      document.getElementById("rowsHold").innerHTML = tmp.querySelector("#rowsHold").innerHTML;
    }
    if (t.id === "fixq") { S.fixQuery = t.value; }
  });
  document.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.id === "fixForm") { S.fixSearched = true; S.fixPick = null; paint(true); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") closeSheet();
    if (ev.key === "Enter" && (ev.target.id === "url" || ev.target.id === "code")) { ev.preventDefault(); var b = document.querySelector("[data-create]"); if (b && !b.disabled) b.click(); }
  });
  function selectLink() {
    var box = document.getElementById("linkbox"); if (!box) return;
    var r = document.createRange(); r.selectNodeContents(box);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('900 40px "Archivo"'), document.fonts.load('600 20px "Archivo"')]).then(function () {
      artCache = {}; if (current() !== "building") paint(true);
    }, function () {});
  }
  paint(false);
})();
</script>
